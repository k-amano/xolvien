services:
  db:
    image: postgres:16-alpine
    container_name: xolvien-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xolvien}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xolvien}
      POSTGRES_DB: ${POSTGRES_DB:-xolvien}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xolvien"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xolvien-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://xolvien:xolvien@db:5432/xolvien
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FRONTEND_URL: http://localhost:5173
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-dev-token-12345}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DOCKER_SOCKET: /var/run/docker.sock
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-xolvien-workspace:latest}
      TASK_DATA_PATH: /data/tasks
      UPLOAD_DATA_PATH: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the persistent volume at /data so both /data/tasks and
      # /data/uploads (repository uploads) survive container rebuilds.
      - task_data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xolvien-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host
    profiles:
      - full

volumes:
  postgres_data:
  task_data:
